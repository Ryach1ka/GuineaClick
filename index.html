<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>モルモットをなでなで</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap">
</head>
<body>
<div class="topbar">
  <button id="soundBtn" type="button">🔇</button>
  <button id="achBtn" type="button">🏆 0/0</button>
</div>
<div class="score">
  <div class="n" id="count">0</div>
  <div class="l">ハート <span id="rate"></span></div>
</div>
<div class="stage">
  <div class="ground"></div>
  <div id="herd"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <button id="pig" aria-label="モルモットをなでる">
    <span class="bubble" id="bubble">プイプイ</span>
    <svg viewBox="0 0 340 240" role="img" aria-hidden="true">
      <ellipse cx="170" cy="226" rx="120" ry="9" fill="#000" opacity=".12"/>
      <!-- body -->
      <ellipse cx="170" cy="150" rx="140" ry="78" fill="#d98c4a"/>
      <ellipse cx="205" cy="165" rx="80" ry="50" fill="#fff4e2"/>
      <ellipse cx="108" cy="120" rx="46" ry="36" fill="#fff4e2"/>
      <!-- head -->
      <ellipse cx="82" cy="128" rx="58" ry="52" fill="#d98c4a"/>
      <path d="M40 112 Q74 100 62 150 Q40 150 32 134 Z" fill="#fff4e2"/>
      <!-- ears -->
      <g class="ear">
        <ellipse cx="110" cy="84" rx="20" ry="14" fill="#c17636" transform="rotate(-25 110 84)"/>
        <ellipse cx="62" cy="84" rx="18" ry="12" fill="#c17636" transform="rotate(20 62 84)"/>
      </g>
      <!-- face -->
      <g class="eye">
        <circle cx="58" cy="118" r="6.5" fill="#2b1d12"/>
        <circle cx="56" cy="115.5" r="2" fill="#fff"/>
      </g>
      <path class="happy" d="M50 120 Q58 110 66 120" stroke="#2b1d12" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <ellipse cx="30" cy="136" rx="9" ry="7" fill="#e58a9a"/>
      <path d="M30 143 Q38 152 48 146" stroke="#2b1d12" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <ellipse class="cheek" cx="74" cy="142" rx="9" ry="6" fill="#f2a07b" opacity=".6"/>
      <!-- feet -->
      <ellipse cx="96" cy="216" rx="20" ry="10" fill="#f2a07b"/>
      <ellipse cx="240" cy="216" rx="22" ry="10" fill="#f2a07b"/>
    </svg>
  </button>
</div>
<div class="shop" id="shop"></div>

<div class="overlay" id="achPanel" role="dialog" aria-modal="true" aria-labelledby="achTitle">
  <div class="card">
    <h2><span id="achTitle">🏆 実績</span><button id="achClose" type="button" aria-label="閉じる">✕</button></h2>
    <ul id="achList"></ul>
  </div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
