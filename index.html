<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>モルモットをなでなで</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap">
</head>
<body>
<div class="topbar">
  <div class="group">
    <button id="mixerBtn" type="button" aria-label="音量" aria-expanded="false" aria-controls="mixer">🔊</button>
    <div class="mixer" id="mixer" hidden>
      <div class="mix-row">
        <button id="bgmBtn" type="button" class="mix-toggle">🎵</button>
        <label for="bgmVol">BGM</label>
        <input id="bgmVol" type="range" min="0" max="100" step="5">
        <output id="bgmVolOut" for="bgmVol"></output>
      </div>
      <div class="mix-row">
        <button id="soundBtn" type="button" class="mix-toggle">🔔</button>
        <label for="sfxVol">効果音</label>
        <input id="sfxVol" type="range" min="0" max="100" step="5">
        <output id="sfxVolOut" for="sfxVol"></output>
      </div>
    </div>
  </div>
  <div class="group">
    <button id="pauseBtn" type="button" aria-label="一時停止">⏸</button>
    <button id="homeBtn" type="button" aria-label="思い出ショップと記録">🏡</button>
    <button id="achBtn" type="button">🏆 0/0</button>
  </div>
</div>

<!-- 寒波のメーター：何夜目・ノルマ・残り時間 -->
<div class="winter" id="winter">
  <div class="w-row">
    <span class="w-night" id="nightLabel">🌙 1夜目</span>
    <span class="w-quota" id="quotaLabel">❄️ ノルマ ♥40</span>
    <span class="w-time" id="timeLabel">1:00</span>
  </div>
  <div class="w-bar" aria-hidden="true"><div class="w-fill" id="quotaFill"></div><div class="w-time-fill" id="timeFill"></div></div>
  <button id="clearBtn" type="button" class="clear-btn" hidden>✅ ノルマ達成！ 夜をおえる ▶</button>
</div>

<div class="score">
  <div class="n" id="count">0</div>
  <div class="l">ハート <span id="rate"></span></div>
</div>
<div class="stage">
  <div class="ground"></div>
  <div id="decor"></div>
  <div id="herd"></div>
  <div class="frost" id="frost" aria-hidden="true"></div>
  <div class="snow" id="snow" aria-hidden="true"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="banner" id="banner" aria-live="assertive"></div>
  <!-- 作戦タイム：夜と夜のあいだ（時間は止まっている） -->
  <div class="breakbar" id="breakBar" hidden>
    <div class="bb-text"><b id="breakTitle">☀️ 作戦タイム</b><small id="breakSub"></small></div>
    <div class="bb-btns">
      <button id="giftBtn" type="button" class="gift" hidden>🎁 <span id="giftCount">1</span></button>
      <button id="nightBtn" type="button" class="primary">🌙 1夜目へ</button>
    </div>
  </div>
  <button id="pig" aria-label="モルモットをなでる">
    <span class="bubble" id="bubble">プイプイ</span>
    <svg id="pigSvg" viewBox="0 0 340 260" aria-hidden="true">
      <defs>
        <radialGradient id="pigFurG" cx="38%" cy="28%" r="78%">
          <stop offset="0" style="stop-color:var(--fur-light)"/>
          <stop offset=".55" style="stop-color:var(--fur)"/>
          <stop offset="1" style="stop-color:var(--fur-dark)"/>
        </radialGradient>
        <!-- 色に関係なく丸みを出す重ね塗り（仲間のモルモットでも使う） -->
        <radialGradient id="pigShadeOver" cx="38%" cy="26%" r="80%">
          <stop offset="0" stop-color="#fff" stop-opacity=".35"/>
          <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
          <stop offset="1" stop-color="#000" stop-opacity=".3"/>
        </radialGradient>
        <linearGradient id="pigWhiteG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffffff"/>
          <stop offset="1" stop-color="#e6dccd"/>
        </linearGradient>
        <radialGradient id="pigEyeG" cx="38%" cy="32%" r="70%">
          <stop offset="0" stop-color="#5a3622"/>
          <stop offset=".55" stop-color="#1c110a"/>
          <stop offset="1" stop-color="#0d0805"/>
        </radialGradient>
        <radialGradient id="pigGroundShade" cx="50%" cy="100%" r="70%">
          <stop offset="0" stop-color="#000" stop-opacity=".28"/>
          <stop offset="1" stop-color="#000" stop-opacity="0"/>
        </radialGradient>
        <!-- 輪郭を毛っぽくふわっとさせる -->
        <filter id="pigFuzz" x="-6%" y="-8%" width="112%" height="116%">
          <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="6" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
        <clipPath id="pigBodyClip">
          <path id="pigBodyPath" d="M52 182 C30 172 24 142 38 124 C50 104 76 92 108 92 C150 76 232 74 280 100 C318 122 324 182 298 210 C272 232 122 234 84 222 C68 214 58 200 52 182 Z"/>
        </clipPath>
        <!-- ダッチ柄の白い部分：鼻すじのブレーズと胴の帯 -->
        <g id="pigPatch" fill="url(#pigWhiteG)">
          <path d="M80 90 C72 104 58 110 26 112 L18 200 L74 210 C66 176 70 136 94 96 Z"/>
          <path d="M150 70 C136 120 134 180 148 240 L198 240 C182 182 182 122 196 70 Z"/>
        </g>
        <path id="pigEarPath" d="M108 100 C110 84 128 76 146 82 C158 86 158 98 149 104 C139 110 118 110 108 100 Z"/>
      </defs>

      <ellipse cx="176" cy="229" rx="132" ry="10" fill="url(#pigGroundShade)"/>

      <g class="squash">
       <g class="purr">
        <g class="breathe">
          <!-- 足（体の下からちょこっと見えるだけ） -->
          <ellipse cx="96" cy="226" rx="11" ry="5" fill="#f0b29a"/>
          <ellipse cx="252" cy="227" rx="12" ry="5" fill="#f0b29a"/>

          <!-- 体（頭と体がひとつながりの「おにぎり型」） -->
          <g filter="url(#pigFuzz)">
            <use href="#pigBodyPath" fill="url(#pigFurG)"/>
            <g clip-path="url(#pigBodyClip)">
              <use class="patch" href="#pigPatch"/>
              <ellipse cx="185" cy="246" rx="190" ry="60" fill="url(#pigGroundShade)" opacity=".7"/>
              <g class="fur-strokes" stroke-linecap="round" fill="none"></g>
              <!-- 寒さで毛が青白くなる（濃さは --cold で変わる） -->
              <use class="ice" href="#pigBodyPath" fill="#cfe9ff"/>
            </g>
          </g>

          <!-- 背中に積もる雪（寒くなるほど見えてくる） -->
          <path class="snowcap" d="M138 86 Q168 64 206 66 Q248 68 274 92 Q256 86 240 92 Q222 84 204 92 Q186 84 168 92 Q152 86 138 86 Z" fill="#ffffff" stroke="#d6ecff" stroke-width="2"/>

          <!-- 耳：薄い花びら型で少し垂れている -->
          <g class="ear">
            <use href="#pigEarPath" style="fill:var(--ear)"/>
            <path d="M116 99 C118 88 130 83 143 87 C151 90 150 98 144 101 C136 105 122 105 116 99 Z" fill="#f2a9a0" opacity=".4"/>
          </g>

          <!-- 目：顔の横で黒目がち、光を2つ -->
          <g class="eye-open">
            <ellipse cx="82" cy="124" rx="10" ry="11" fill="url(#pigEyeG)"/>
            <ellipse cx="82" cy="124" rx="10" ry="11" fill="none" stroke="#000" stroke-opacity=".25" stroke-width="1.5"/>
            <circle cx="78.5" cy="119.5" r="3.6" fill="#fff"/>
            <circle cx="86" cy="129" r="1.6" fill="#fff" opacity=".8"/>
          </g>
          <path class="eye-closed" d="M72 124 Q82 131 92 124" stroke="#2b1d12" stroke-width="3" fill="none" stroke-linecap="round"/>
          <path class="eye-happy" d="M72 127 Q82 116 92 127" stroke="#2b1d12" stroke-width="3.2" fill="none" stroke-linecap="round"/>

          <ellipse class="blush" cx="66" cy="150" rx="11" ry="6.5" fill="#f2918a" opacity=".38"/>

          <!-- あご（もぐもぐで動く）と、くわえた牧草 -->
          <ellipse class="jaw" cx="44" cy="160" rx="8" ry="4.5" fill="#efe5d8"/>
          <path class="hay" d="M42 152 L2 166" stroke="#d6bf72" stroke-width="3" stroke-linecap="round"/>

          <!-- 鼻と口とヒゲ（いつもヒクヒク） -->
          <g class="nose">
            <ellipse cx="42" cy="140" rx="9" ry="7" fill="#f6d9cf" opacity=".6"/>
            <path d="M35 138 C37 134 44 134 46 138 C44 141.5 37 141.5 35 138 Z" fill="#8a5a4c"/>
            <path d="M40.5 141 L40.5 147 M40.5 147 Q37 151 33.5 150 M40.5 147 Q44 151 47.5 150" stroke="#8a5a4c" stroke-width="1.6" fill="none" stroke-linecap="round"/>
            <g stroke="#3a2a22" stroke-opacity=".4" stroke-width=".8" fill="none" stroke-linecap="round">
              <path d="M38 144 Q20 135 3 131"/>
              <path d="M38 146 Q20 146 2 148"/>
              <path d="M39 148 Q22 157 7 164"/>
            </g>
          </g>

          <g class="zzz"><text x="120" y="70">Z</text><text x="136" y="56">z</text></g>
        </g>
       </g>
      </g>
    </svg>
  </button>
</div>
<div class="shop" id="shop"></div>

<div class="overlay" id="achPanel" role="dialog" aria-modal="true" aria-labelledby="achTitle">
  <div class="card">
    <h2><span id="achTitle">🏆 実績</span><button id="achClose" type="button" aria-label="閉じる">✕</button></h2>
    <ul id="achList"></ul>
  </div>
</div>

<div class="overlay" id="draftPanel" role="dialog" aria-modal="true" aria-labelledby="draftTitle">
  <div class="card draft-card">
    <h2 id="draftTitle">🎁 夜を越えたごほうび！おやつをえらぼう</h2>
    <p class="draft-sub" id="draftSub"></p>
    <div class="draft-list" id="draftList"></div>
    <div class="draft-foot">
      <button id="rerollBtn" type="button" class="secondary">🔄 ひきなおす</button>
    </div>
  </div>
</div>

<!-- 🏡 おうち：思い出ショップと記録 -->
<div class="overlay" id="homePanel" role="dialog" aria-modal="true" aria-labelledby="homeTitle">
  <div class="card move-card">
    <h2><span id="homeTitle">🏡 おうち</span><button id="homeClose" type="button" aria-label="閉じる">✕</button></h2>
    <h3>今回のおやつ</h3>
    <ul class="mycards" id="myCards"></ul>
    <h3>思い出ショップ <span class="mem" id="memBalance"></span></h3>
    <ul class="metashop" id="metaShop"></ul>
    <h3>記録</h3>
    <div class="records" id="records"></div>
    <button id="giveUp" type="button" class="secondary wide">この冬をあきらめる</button>
  </div>
</div>

<!-- 冬が終わったとき（負け / クリア） -->
<div class="overlay" id="endPanel" role="dialog" aria-modal="true" aria-labelledby="endTitle">
  <div class="card end-card">
    <div class="end-icon" id="endIcon" aria-hidden="true">🥶</div>
    <h2 id="endTitle">寒さに負けちゃった…</h2>
    <p class="end-sub" id="endSub"></p>
    <div class="run-sum" id="endSum"></div>
    <p class="end-mem" id="endMem"></p>
    <div class="end-btns">
      <button id="endHome" type="button" class="secondary">🏡 思い出ショップ</button>
      <button id="endRetry" type="button" class="primary">もう一度ふゆごもり</button>
    </div>
  </div>
</div>

<!-- ⏸ ひとやすみ -->
<div class="overlay pause" id="pausePanel" role="dialog" aria-modal="true" aria-labelledby="pauseTitle">
  <button class="pause-card" id="pauseResume" type="button">
    <span class="pause-icon" aria-hidden="true">⏸</span>
    <b id="pauseTitle">ひとやすみ中</b>
    <small>タップでつづける</small>
  </button>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
